<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
</head>
<body>
    <h1>{{ title }}</h1>

    {% for item in news %}
        <div>
            <h3>{{ item.title }}</h3>
            <p>{{ item.content }}</p>
            <p>{{ item.created_at|date:"d.m.Y H:i:s" }}</p>
        </div>
        <hr>
    {% endfor %}
</body>
</html>
